!
! CSW1 - Extended ACL Interface Applications
! Intended ACL bindings for VLAN interfaces (SVIs).
! Packet Tracer does not consistently retain these bindings
! in the exported running configuration.
!

interface Vlan71
 ip access-group Guest_WiFi_IN in

interface Vlan70
 ip access-group Employee_WiFi_IN in

interface Vlan20
 ip access-group Accounting_IN in

interface Vlan30
 ip access-group Reception_IN in

interface Vlan40
 ip access-group IT_Support_IN in

interface Vlan10
 ip access-group Management_IN in

interface Vlan80
 ip access-group Voice_IN in

interface Vlan99
 ip access-group NET_MGMT_OUT out
